feature_name: "OpenShift Console QuickStart Guides for Secrets Store CSI Driver"
epic_key: SSCSI-235
target_repo: https://github.com/openshift/secrets-store-csi-driver-operator

# --- Required Inputs ---

enhancement_proposal: |
  ## Title
  Add interactive OpenShift Console QuickStart guides fo pr Secrets Store CSI Driver Operator

  ## Problem
  Cluster administrators and developers have no guided, in-console experience for getting
  started with the Secrets Store CSI Driver Operator. The only documentation is external
  (README, upstream docs). This creates a high barrier to adoption, especially for users
  who discover the operator via OperatorHub or the OpenShift Console software catalog.

  ## Solution
  Add ConsoleQuickStart resources to the operator OLM bundle so they are automatically
  available in the OpenShift Console "Quick Starts" menu when the operator is installed.

  Two QuickStart guides:
  1. **Installation QuickStart** (sscsi-install-quickstart) — step-by-step guide:
     Task 1: Install Secrets Store CSI Driver Operator from OperatorHub
     Task 2: Create a ClusterCSIDriver resource to enable the driver
  2. **Example Usage QuickStart** (sscsi-example-quickstart) — step-by-step guide:
     Task 1: Verify operator is installed and running
     Task 2: Select or create a project namespace
     Task 3: Create a SecretProviderClass for a provider (Vault/AWS/Azure/GCP)
     Task 4: Deploy a sample application that mounts secrets via CSI volume

  Four ConsoleYAMLSample resources for provider-specific SecretProviderClass templates:
  - Vault, AWS Secrets Manager / SSM, Azure Key Vault, GCP Secret Manager

  ## Implementation approach — two-phase
  Phase 1 (PR #94): Add all manifests to demo/console/ as standalone apply-able YAMLs.
    Accessible via: oc apply -f demo/console/quick-start/secrets-store-csi/
  Phase 2 (PR #95): Move example-usage QuickStart + samples into the OLM bundle
    (config/manifests/stable/) so they ship automatically with the operator.
    Add required release annotations so they appear on IBM Cloud Managed, self-managed HA,
    and single-node developer deployments. Remove install QuickStart from OLM
    (installation is OLM's responsibility; OLM handles it differently).

  ## What is NOT in scope
  - No Go source changes; no unit tests (manifest-only changes)
  - Install QuickStart (sscsi-install-quickstart) remains in demo/ only — not in OLM bundle
  - No ServiceMonitor or metrics changes

  ## Risks
  - Navigation path in console changes between OCP versions (Operators → Ecosystem rename)
  - Provider-specific placeholder values require users to substitute real values
  - Typo in PR #94 ("prosessing" → "possessing") fixed in PR #95


repo_state: |
  # Pre-feature repo state
  # Commit: a504fc5dd050e685409ec408e03da3d4a7526146 (SSCSI-230: library bump, merged 2025-11-23)
  # Branch: main

  ## Directory layout at base commit
  assets/
    assets.go                     # //go:embed *.yaml rbac/*.yaml (no network-policy yet)
    csidriver.yaml
    node.yaml                     # DaemonSet; image vars ${DRIVER_IMAGE} etc.; no NP label yet
    node_sa.yaml, cabundle_cm.yaml
    rbac/
      privileged_role.yaml, node_privileged_binding.yaml
      secretproviderclasses_role.yaml, secretproviderclasses_binding.yaml
    # network-policy/ does NOT exist yet (added in later commits May 2025)
  config/manifests/stable/
    secrets-store-csi-driver-operator.clusterserviceversion.yaml  # CSV — no QuickStarts yet
    # No sscsi-example-quickstart.yaml yet
  demo/                           # DOES NOT EXIST yet (created by PR #94)
  pkg/operator/
    starter.go                    # RunOperator; CSIControllerSet chain (unchanged in this feature)
    starter_test.go               # 4 table-driven tests for getOperatorSyncState

  ## Architecture at base commit
  - library-go csicontrollerset; no controller-runtime
  - ClusterCSIDriver singleton; no custom CRD types
  - Assets embedded via Go embed (not bindata); ${NAMESPACE} substitution at apply time
  - OLM bundle in config/manifests/stable/; bundle.Dockerfile copies all *.yaml
  - ConsoleQuickStart is a cluster-scoped resource (console.openshift.io/v1)
  - ConsoleYAMLSample is a cluster-scoped resource (console.openshift.io/v1)
  - OLM installs ConsoleQuickStart/ConsoleYAMLSample automatically if included in bundle

  ## Test exemplar (starter_test.go)
  Pattern: table-driven, t.Run(tc.name, ...), standard testing + library-go FakeOperatorClient
  No assertion libraries. t.Fatalf for assertions, t.Errorf for non-fatal.
  4 cases: Managed, Unmanaged, Removed, DeletionTimestamp+Managed→Removed

  ## ConsoleQuickStart schema (relevant fields)
  apiVersion: console.openshift.io/v1
  kind: ConsoleQuickStart
  metadata:
    name: <name>
    annotations:
      capability.openshift.io/name: "Console"             # required for OLM bundle inclusion
      include.release.openshift.io/ibm-cloud-managed: "true"
      include.release.openshift.io/self-managed-high-availability: "true"
      include.release.openshift.io/single-node-developer: "true"
  spec:
    displayName, description, durationMinutes, icon, tags, prerequisites
    introduction, tasks[]: {title, description, review, summary}

  ## ConsoleYAMLSample schema (relevant fields)
  apiVersion: console.openshift.io/v1
  kind: ConsoleYAMLSample
  metadata:
    name: <name>
  spec:
    targetResource: {apiVersion: secrets-store.csi.x-k8s.io/v1, kind: SecretProviderClass}
    title, description, yaml (YAML string with provider-specific config)

user_stories: |
  US-1: In-console installation guidance
    As a cluster administrator discovering the Secrets Store CSI Driver via OperatorHub,
    Given I have installed the operator from OperatorHub,
    When I navigate to "Quick Starts" in the OpenShift Console,
    Then I see "Get started with Secrets Store CSI Driver" QuickStart
    And I can follow step-by-step tasks to create a ClusterCSIDriver and verify the driver runs.

  US-2: In-console example usage with provider templates
    As a developer who wants to mount cloud secrets into a pod,
    Given the operator is installed and a ClusterCSIDriver exists,
    When I navigate to Quick Starts in the OpenShift Console,
    Then I see "Use Secrets Store CSI Driver" QuickStart
    And I can create a SecretProviderClass from a provider-specific YAML sample (Vault/AWS/Azure/GCP)
    And I can follow tasks to deploy a sample app that mounts the secret.

  US-3: QuickStarts available automatically on operator install via OLM
    As a cluster administrator installing via OLM subscription,
    Given I install the operator via OLM (not manual oc apply),
    When OLM applies the bundle,
    Then the ConsoleQuickStart and ConsoleYAMLSample resources are created automatically
    And they are visible in the Console without any additional manual steps.

  US-4: Provider-specific YAML samples cover all major providers
    As a developer using Vault, AWS, Azure, or GCP as their secret backend,
    Given I navigate to create a SecretProviderClass in the Console,
    When I select "Samples" in the YAML editor,
    Then I see a provider-specific template for my backend
    And the template has clearly marked placeholders I need to substitute.


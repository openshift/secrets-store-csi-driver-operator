# --- Bugs ---

bugs:
  - key: SSCSI-235-BUG-1
    summary: "Console navigation path changed: 'Operators' renamed to 'Ecosystem'"
    root_cause: |
      PR #94 referenced navigation to the "Operators" section in the console for finding
      "Installed Operators". Between PR #94 and PR #95, the OpenShift Console renamed
      this section to "Ecosystem". PR #95 updated the QuickStart task text and navigation
      highlight reference to use [Ecosystem]{{highlight qs-nav-ecosystem}}.
      Caught during review by CodeRabbit (ask: verify navigation path is correct).
    fix_pr: "https://github.com/openshift/secrets-store-csi-driver-operator/pull/95"
    affected_stage: implementation

  - key: SSCSI-235-BUG-2
    summary: "Typo in example QuickStart: 'prosessing' instead of 'possessing'"
    root_cause: |
      PR #94 contained a typo in the SecretProviderClass creation task description.
      Caught during CodeRabbit review of PR #95. Fixed in the same PR.
    fix_pr: "https://github.com/openshift/secrets-store-csi-driver-operator/pull/95"
    affected_stage: implementation

  - key: SSCSI-235-GAP-1
    summary: "Install QuickStart was initially bundled in OLM then removed"
    root_cause: |
      The initial plan (PR #94) included both an install QuickStart and an example-usage
      QuickStart. During PR #95, the decision was made NOT to include the install QuickStart
      in the OLM bundle — the rationale being that installing via OLM and then having an
      OLM-bundled "how to install" guide is circular. Only the example-usage QuickStart
      was moved to the OLM bundle. This design decision was not captured in the original
      feature spec.
    fix_pr: "https://github.com/openshift/secrets-store-csi-driver-operator/pull/95 (resolved)"
    affected_stage: specs

  - key: SSCSI-235-GAP-2
    summary: "No OLM annotations in PR #94 — required for multi-deployment visibility"
    root_cause: |
      PR #94 added QuickStart manifests without the required OLM annotations:
        capability.openshift.io/name: "Console"
        include.release.openshift.io/ibm-cloud-managed: "true"
        include.release.openshift.io/self-managed-high-availability: "true"
        include.release.openshift.io/single-node-developer: "true"
      Without these, the QuickStart would not appear on IBM Cloud Managed or
      single-node developer deployments. Fixed in PR #95 when moving to OLM bundle.
      Root cause: missing spec requirement for multi-deployment annotation conventions.
    fix_pr: "https://github.com/openshift/secrets-store-csi-driver-operator/pull/95"
    affected_stage: specs

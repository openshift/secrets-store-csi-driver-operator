meta:
  stage: code-generation
  template: code-generation-template.md
  round: 1
  feature_bundle: SSCSI-235
  generated: "2026-07-02"

evals:
  - id: cg-001
    oape_command: manual
    name: "Manual manifest task: OLM bundle YAML includes deployment-profile annotations"
    description: >
      When /opsx-apply executes a manifest-only task for adding a resource to
      config/manifests/stable/, the generated YAML must include all 4 deployment-profile
      annotation keys. This is a pre-output self-check for the manual OAPE command.
    input:
      task: |
        oape_command: manual
        target_file: config/manifests/stable/sscsi-example-quickstart.yaml
        objective: Add ConsoleQuickStart resource to OLM bundle.
        implementation_notes: |
          Must include OLM bundle annotations:
            capability.openshift.io/name: "Console"
            include.release.openshift.io/ibm-cloud-managed: "true"
            include.release.openshift.io/self-managed-high-availability: "true"
            include.release.openshift.io/single-node-developer: "true"
    expected_output:
      yaml_annotations:
        - "capability.openshift.io/name: Console"
        - "include.release.openshift.io/ibm-cloud-managed: 'true'"
        - "include.release.openshift.io/self-managed-high-availability: 'true'"
        - "include.release.openshift.io/single-node-developer: 'true'"
    rubric:
      pass: "All 4 annotations present with correct values in generated YAML"
      fail: "One or more annotations missing; resource invisible on some deployment profiles"
    severity: high
    source_issue: SSCSI-235-GAP-2

  - id: cg-002
    oape_command: manual
    name: "Manual manifest task: console navigation token matches current OCP version"
    description: >
      When /opsx-apply generates a ConsoleQuickStart YAML, navigation tokens
      (qs-nav-*) must match the tokens documented in the repo-assessment for the
      target OCP release. Do not copy tokens from older examples.
    input:
      task: |
        oape_command: manual
        target_file: config/manifests/stable/sscsi-example-quickstart.yaml
        objective: Create QuickStart tasks guiding user to find operator in console.
        implementation_notes: |
          Target OCP 4.18+. Navigation token: qs-nav-ecosystem (not qs-nav-operator-hub).
          Verify token from repo-assessment §10.5 before using.
    expected_output:
      navigation_token: "qs-nav-ecosystem"
      must_not_contain: "qs-nav-operator-hub"
    rubric:
      pass: "QuickStart task descriptions use qs-nav-ecosystem"
      fail: "QuickStart uses qs-nav-operator-hub (stale pre-4.18 token)"
    severity: medium
    source_issue: SSCSI-235-BUG-1

  - id: cg-003
    oape_command: manual
    name: "Manual manifest task: install QuickStart only in demo/, not bundle"
    description: >
      When /opsx-apply generates sscsi-install-quickstart.yaml, it must place it
      in demo/console/quick-start/secrets-store-csi/ only. The Non-goals in the task
      payload must be honored (no config/manifests/stable/ output for this file).
    input:
      task: |
        oape_command: manual
        target_file: demo/console/quick-start/secrets-store-csi/sscsi-install-quickstart.yaml
        non_goals: "Must NOT create config/manifests/stable/sscsi-install-quickstart.yaml"
    expected_output:
      output_files:
        - "demo/console/quick-start/secrets-store-csi/sscsi-install-quickstart.yaml"
      must_not_output:
        - "config/manifests/stable/sscsi-install-quickstart.yaml"
    rubric:
      pass: "Output only in demo/console/; no bundle file created"
      fail: "Output also created in config/manifests/stable/ (violates non-goals)"
    severity: medium
    source_issue: SSCSI-235-GAP-1

  - id: cg-004
    oape_command: manual
    name: "Manual assets task: DaemonSet uses CSO pod label, no standalone api-server NP files"
    description: >
      When /opsx-apply adds network policy support, it must add the CSO pod label to
      assets/node.yaml DaemonSet template and must NOT create standalone allow-egress-to-
      api-server NetworkPolicy YAML files. Anti-pattern from network-policy-redesign.
    input:
      task: |
        oape_command: manual
        target_file: assets/node.yaml (label addition) + assets/network-policy/allow-ingress-to-metrics-operand.yaml (new file)
        implementation_notes: |
          Use CSO pod label hook for api-server egress. Add label to DaemonSet pod template:
            openshift.storage.network-policy.api-server: allow
          Create only allow-ingress-to-metrics-operand.yaml (operator-specific ingress).
          Do NOT create allow-egress-to-api-server-*.yaml files (CSO manages those).
    expected_output:
      assets_node_yaml: |
        spec.template.metadata.labels includes:
          openshift.storage.network-policy.api-server: allow
      created_np_files:
        - "assets/network-policy/allow-ingress-to-metrics-operand.yaml"
      must_not_create:
        - "assets/network-policy/allow-egress-to-api-server-operator.yaml"
        - "assets/network-policy/allow-egress-to-api-server-operand.yaml"
    rubric:
      pass: >
        node.yaml has the CSO label; only ingress NP file created; no egress NP files
      fail: >
        Standalone allow-egress-to-api-server-*.yaml files created instead of using label
    severity: medium
    source_issue: network-policy-redesign

  - id: cg-005
    oape_command: api-implement
    name: "Controller task: new static asset wired into CSIControllerSet correctly"
    description: >
      When /opsx-apply adds a new static asset (new YAML in assets/) and wires it into
      starter.go, the asset must be added to the correct controller list
      (ConditionalStaticResourcesController, not a new standalone controller).
      This is the pattern from network-policy commit 8974dbc4.
    input:
      task: |
        oape_command: api-implement
        target_files: assets/network-policy/allow-ingress-to-metrics-operand.yaml, pkg/operator/starter.go
        objective: Wire new network policy asset into the operator reconciliation loop.
        implementation_notes: |
          Add asset path to ConditionalStaticResourcesController assets list in starter.go.
          Follow pattern: see existing network-policy entries in the StaticResources list.
          Do NOT create a new CSIControllerSet hook for this.
    expected_output:
      starter_go:
        must_contain:
          - "network-policy/allow-ingress-to-metrics-operand.yaml"
        pattern: "added to existing StaticResources or ConditionalStaticResources list"
        must_not_contain: "WithCSIDriverController" # should not add new hook for static assets
    rubric:
      pass: >
        starter.go adds asset path to existing StaticResources controller list;
        no new CSIControllerSet hook created
      fail: >
        New WithXxx CSIControllerSet hook created for a static asset (wrong pattern);
        or asset not wired into any controller
    severity: medium
    source_issue: workflow-correctness

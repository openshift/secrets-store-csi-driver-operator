meta:
  stage: implementation
  template: implementation-report-template.md
  round: 1
  feature_bundle: SSCSI-235
  generated: "2026-07-02"

evals:
  - id: impl-001
    name: "ConsoleQuickStart manifest includes all 4 deployment-profile annotations"
    description: >
      When implementing a ConsoleQuickStart for the OLM bundle, the produced manifest must
      include all required deployment-profile annotations. Missing annotations causes the
      resource to be invisible on IBM Cloud Managed or SNO deployments.
    input:
      task_payload: |
        Task: Add sscsi-example-quickstart.yaml to config/manifests/stable/.
        Acceptance criteria includes: verify deployment-profile annotations present.
      constitution: |
        OLM bundle resources must carry: capability.openshift.io/name and
        include.release.openshift.io/* annotations.
    expected_output:
      manifest_field: "metadata.annotations"
      must_contain:
        - "capability.openshift.io/name: Console"
        - "include.release.openshift.io/ibm-cloud-managed: 'true'"
        - "include.release.openshift.io/self-managed-high-availability: 'true'"
        - "include.release.openshift.io/single-node-developer: 'true'"
    rubric:
      pass: >
        Produced manifest has all 4 annotation keys with correct values
      fail: >
        Manifest is missing 1 or more annotation keys; resource will be invisible
        on some deployment profiles
    severity: high
    source_issue: SSCSI-235-GAP-2
    rca: RCA-1

  - id: impl-002
    name: "ConsoleQuickStart navigation token uses current OCP-correct qs-nav-* token"
    description: >
      QuickStart tasks that reference console navigation sections must use the current
      qs-nav-* token for the target OCP version. Using an outdated token results in broken
      navigation references (SSCSI-235-BUG-1: qs-nav-operator-hub → qs-nav-ecosystem).
    input:
      task_payload: |
        Task: Create QuickStart tasks that guide user to find the operator in the console.
        Target OCP: 4.18+
      repo_assessment: |
        Current navigation token: qs-nav-ecosystem (OCP 4.18+)
        Former token: qs-nav-operator-hub (pre-4.18, deprecated)
    expected_output:
      manifest_field: "spec.tasks[].description"
      must_contain:
        - "qs-nav-ecosystem"
      must_not_contain:
        - "qs-nav-operator-hub"
    rubric:
      pass: >
        Produced manifest uses qs-nav-ecosystem for navigation references
      fail: >
        Manifest uses qs-nav-operator-hub (outdated) causing broken navigation
    severity: medium
    source_issue: SSCSI-235-BUG-1
    rca: RCA-2

  - id: impl-003
    name: "ConsoleQuickStart user-visible text is free of typos"
    description: >
      User-visible text in ConsoleQuickStart spec fields (description, introduction, tasks)
      must be reviewed for typos and accuracy. SSCSI-235-BUG-2 was a typo ('prosessing'
      instead of 'possessing') that survived one PR review cycle.
    input:
      task_payload: |
        Task: Create sscsi-example-quickstart.yaml with task descriptions.
        Acceptance criteria: content review of all user-visible text fields.
    expected_output:
      content_check:
        must_not_contain: "prosessing"
        must_contain_correctly: "possessing"
      general: "no spelling errors in spec.introduction, spec.tasks[].description"
    rubric:
      pass: >
        Manifest text passes basic spell-check; all user-visible fields use correct
        OpenShift terminology and accurate navigation references
      fail: >
        Manifest contains typos or inaccurate navigation text that would confuse users
    severity: low
    source_issue: SSCSI-235-BUG-2
    rca: RCA-5

  - id: impl-004
    name: "sscsi-install-quickstart.yaml NOT placed in config/manifests/stable/"
    description: >
      The install QuickStart must be placed in demo/console/ only and must not appear in
      config/manifests/stable/. Bundling install-type QuickStarts creates circular dependency.
    input:
      task_payload: |
        Task: Create sscsi-install-quickstart.yaml targeting demo/console/ only.
        Non-goals: do not add to config/manifests/stable/ (circular dependency risk).
    expected_output:
      file_location: "demo/console/quick-start/secrets-store-csi/sscsi-install-quickstart.yaml"
      must_not_exist: "config/manifests/stable/sscsi-install-quickstart.yaml"
    rubric:
      pass: >
        sscsi-install-quickstart.yaml only in demo/; not in config/manifests/stable/
      fail: >
        sscsi-install-quickstart.yaml also appears in config/manifests/stable/;
        creates circular dependency (install guide bundled by the OLM install itself)
    severity: medium
    source_issue: SSCSI-235-GAP-1
    rca: RCA-3

  - id: impl-005
    name: "Network policy implementation uses pod label hook instead of standalone policies"
    description: >
      When implementing network policies for egress to the Kubernetes API server,
      the operator must use the CSO pod label hook instead of standalone NetworkPolicy YAML.
    input:
      task_payload: |
        Task: Add network policies for operator pod egress to API server.
        Implementation notes: Use CSO pod label hook in assets/node.yaml.
    expected_output:
      assets_node_yaml: "labels include openshift.storage.network-policy.api-server: allow"
      must_not_create:
        - "assets/network-policy/allow-egress-to-api-server-operator.yaml"
        - "assets/network-policy/allow-egress-to-api-server-operand.yaml"
    rubric:
      pass: >
        assets/node.yaml DaemonSet pod labels include the CSO NP hook label;
        no standalone allow-egress-to-api-server NetworkPolicy files created
      fail: >
        Standalone allow-egress-to-api-server-*.yaml NetworkPolicy files created;
        duplicates what CSO already manages
    severity: medium
    source_issue: network-policy-redesign
    rca: RCA-4

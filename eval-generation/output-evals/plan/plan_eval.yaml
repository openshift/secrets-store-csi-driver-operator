meta:
  stage: plan
  template: plan-template.md
  round: 1
  feature_bundle: SSCSI-235
  generated: "2026-07-02"

evals:
  - id: plan-001
    name: "§3.5 includes bundle placement decision per artifact"
    description: >
      For a feature adding resources to the OLM bundle, the plan §3.5 must produce a
      per-artifact placement matrix (bundle vs demo) and identify circular dependency risks.
      Without this, the install QuickStart was mistakenly bundled then removed (SSCSI-235-GAP-1).
    input:
      spec: |
        Feature adds two ConsoleQuickStart resources and four ConsoleYAMLSample resources.
        Phase 1: add all to demo/. Phase 2: move to OLM bundle.
      constitution: |
        AgentRoutingMode: PROVIDED. OLM bundle resources require deployment-profile annotations.
      repo_assessment: |
        config/manifests/stable/ is the OLM bundle dir. bundle.Dockerfile copies *.yaml.
        Installation is OLM-driven. demo/ is for manual apply only.
    expected_output:
      section: "§3.5 Packaging/OLM"
      must_contain:
        - table with resource / location / circular-dependency columns
        - "sscsi-install-quickstart"
        - "demo/ only"
        - "circular"
      must_address:
        - "install QuickStart excluded from OLM bundle"
        - "example QuickStart + YAML samples in bundle"
        - "deployment-profile annotations required for bundled resources"
    rubric:
      pass: >
        §3.5 has a per-resource placement table; install QuickStart explicitly excluded
        from bundle with circular dependency rationale; annotations listed as requirement
      fail: >
        §3.5 says "OLM bundle with required annotations" generically without per-resource
        placement decisions; install QuickStart placement ambiguous
    severity: high
    source_issue: SSCSI-235-GAP-1
    rca: RCA-3

  - id: plan-002
    name: "Phase for adding network policies includes platform pattern survey prerequisite"
    description: >
      When a plan phase adds network policies, it must include a prerequisite to survey
      existing CSO-managed policies before designing custom resources. Missing this
      led to 4 standalone NPs being implemented then replaced with 1 + pod label.
    input:
      spec: |
        Feature adds network policies to restrict egress from operator and operand pods.
      repo_assessment: |
        assets/node.yaml DaemonSet pods carry label:
        openshift.storage.network-policy.api-server: allow (CSO hook).
        Only allow-ingress-to-metrics-operand.yaml is operator-specific.
    expected_output:
      section: "Implementation phase for network policies"
      must_contain:
        - "survey CSO" OR "check existing platform network policies"
        - "reuse CSO-managed policies via pod label"
        - "only operator-specific ingress policies need custom YAML"
    rubric:
      pass: >
        Phase includes explicit prerequisite: survey CSO/CNO for managed policies;
        identifies the pod label hook; plans only 1 operator-specific NP not 4
      fail: >
        Phase directly plans 4 new NetworkPolicy YAML files without surveying platform patterns
    severity: medium
    source_issue: network-policy-redesign
    rca: RCA-4

  - id: plan-003
    name: "OLM bundle annotation verification is in phase verification hooks"
    description: >
      For any plan phase that produces OLM bundle resources, the verification hooks must
      include an OLM annotation audit step (not just CI e2e).
    input:
      spec: |
        Phase 2: Move ConsoleQuickStart to OLM bundle.
      repo_assessment: |
        Bundle CI does not validate annotation completeness; only cluster e2e does.
    expected_output:
      section: "Phase verification hooks"
      must_contain:
        - "verify deployment-profile annotations" OR "annotation audit"
        - "bundle.Dockerfile includes all new yaml files"
    rubric:
      pass: >
        Phase verification hooks include: (1) check manifest annotations, (2) verify
        bundle.Dockerfile includes the new file
      fail: >
        Phase verification hooks only say "e2e CI" without explicit annotation check
    severity: medium
    source_issue: SSCSI-235-GAP-2
    rca: RCA-1

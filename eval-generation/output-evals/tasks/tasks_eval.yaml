meta:
  stage: tasks
  template: tasks-template.md
  round: 1
  feature_bundle: SSCSI-235
  generated: "2026-07-02"

evals:
  - id: tasks-001
    name: "OLM bundle annotation checklist in acceptance criteria for bundle resource task"
    description: >
      Any task whose target files include config/manifests/stable/*.yaml MUST have an
      acceptance criterion explicitly requiring the full set of deployment-profile annotations.
      Missing this led to SSCSI-235-GAP-2 (annotations absent in PR #94).
    input:
      plan_context: |
        Task: Add sscsi-example-quickstart.yaml to config/manifests/stable/
        Target file: config/manifests/stable/sscsi-example-quickstart.yaml
      constitution: |
        OLM bundle resources require: capability.openshift.io/name and
        include.release.openshift.io/* deployment-profile annotations.
    expected_output:
      section: "§4 Task Specifications — Acceptance criteria"
      must_contain:
        - "capability.openshift.io/name"
        - "include.release.openshift.io/ibm-cloud-managed"
        - "include.release.openshift.io/self-managed-high-availability"
        - "include.release.openshift.io/single-node-developer"
    rubric:
      pass: >
        Task acceptance criteria explicitly lists all 4 annotation keys as required;
        labels this as a non-negotiable bundle contract check
      fail: >
        Acceptance criteria only says "verify QuickStart visible in console" without
        annotation checklist; annotations were omitted in PR #94
    severity: high
    source_issue: SSCSI-235-GAP-2
    rca: RCA-1

  - id: tasks-002
    name: "User-facing content review AC for ConsoleQuickStart manifest task"
    description: >
      A task creating ConsoleQuickStart YAML must include an acceptance criterion requiring
      content review of all user-visible text fields. Missing this led to SSCSI-235-BUG-2
      (typo 'prosessing' survived PR #94 review).
    input:
      plan_context: |
        Task: Create sscsi-example-quickstart.yaml with 4 tasks covering operator
        verification, namespace selection, SecretProviderClass creation, sample app deploy.
      spec: |
        US-2: Developer follows step-by-step QuickStart to mount cloud secrets.
    expected_output:
      section: "§4 Task Specifications — Acceptance criteria"
      must_contain:
        - "user-visible text" OR "description fields" OR "content review"
        - "typos" OR "grammatical" OR "navigation path"
    rubric:
      pass: >
        Acceptance criteria has an explicit 'content review' criterion covering user-visible
        text fields in the YAML manifest
      fail: >
        Acceptance criteria only covers functional behavior (QuickStart visible, tasks work)
        without content quality check
    severity: low
    source_issue: SSCSI-235-BUG-2
    rca: RCA-5

  - id: tasks-003
    name: "Install QuickStart task explicitly excludes OLM bundle as target location"
    description: >
      A task for the install QuickStart must explicitly state that its target location is
      demo/console/ only and must include a Non-goals bullet prohibiting placement in the
      OLM bundle. Without this, the task agent may bundle it (as in original plan).
    input:
      plan_context: |
        Task: Create sscsi-install-quickstart.yaml for standalone apply via oc apply.
        Bundle placement decision: install QuickStart in demo/ only (circular dependency).
    expected_output:
      section: "§4 Task Specifications"
      must_contain:
        - target: "demo/console/"
        - non_goals: "config/manifests/stable/" OR "OLM bundle"
      must_address:
        - "circular dependency rationale"
    rubric:
      pass: >
        Target files clearly says demo/console/ only; Non-goals explicitly says not in
        config/manifests/stable/ with circular dependency rationale
      fail: >
        Task only says "create install QuickStart" without explicit bundle exclusion;
        task agent may add to bundle
    severity: medium
    source_issue: SSCSI-235-GAP-1
    rca: RCA-1

  - id: tasks-004
    name: "Network policy task includes platform pattern survey as prerequisite"
    description: >
      A task for adding network policies must include an implementation note to first
      check CSO-managed shared policies and the pod label hook before creating standalone
      NetworkPolicy YAML files.
    input:
      plan_context: |
        Task: Add network policies for operator pod egress and operand pod ingress.
      repo_assessment: |
        assets/node.yaml pods carry label openshift.storage.network-policy.api-server: allow.
        CSO manages egress-to-api-server policies for pods with this label.
    expected_output:
      section: "§4 Task Specifications — Implementation notes"
      must_contain:
        - "CSO" OR "cluster-storage-operator"
        - "pod label hook" OR "openshift.storage.network-policy.api-server"
        - "only operator-specific ingress policy needed"
    rubric:
      pass: >
        Implementation notes say: check CSO for existing managed policies; use pod label
        hook for api-server egress; only create operator-specific ingress policy
      fail: >
        Implementation notes say "create 4 NetworkPolicy files for all cases" without
        checking CSO; results in redundant standalone policies
    severity: medium
    source_issue: network-policy-redesign
    rca: RCA-4

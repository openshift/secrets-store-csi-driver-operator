meta:
  stage: repo-assessment
  template: repo-assessment-template.md
  round: 1
  feature_bundle: SSCSI-235
  generated: "2026-07-02"

evals:
  - id: ra-001
    name: "OLM bundle resource annotations documented in §10.6"
    description: >
      The repo-assessment agent must document in §10.6 (Packaging/Lifecycle) the required
      deployment-profile annotations for each resource type shipped in the OLM bundle.
      Missing this led to SSCSI-235 PR #94 omitting required annotations.
    input:
      spec_context: |
        Feature adds ConsoleQuickStart and ConsoleYAMLSample resources to
        the OLM bundle (config/manifests/stable/).
      repo_context: |
        Existing bundle: config/manifests/stable/ contains CSV and will gain
        sscsi-example-quickstart.yaml and sample YAML files.
    expected_output:
      section: "§10.6 Packaging & Lifecycle"
      must_contain:
        - "capability.openshift.io/name"
        - "include.release.openshift.io/ibm-cloud-managed"
        - "include.release.openshift.io/self-managed-high-availability"
        - "include.release.openshift.io/single-node-developer"
        - "Console"  # capability name for ConsoleQuickStart resources
    rubric:
      pass: "§10.6 lists annotation keys and their values for ConsoleQuickStart/ConsoleYAMLSample"
      fail: "§10.6 only mentions CSV structure and upgrade path; no annotation requirements"
    severity: high
    source_issue: SSCSI-235-GAP-2
    rca: RCA-1

  - id: ra-002
    name: "Console navigation token version coupling documented in §10.5"
    description: >
      The repo-assessment must document in §10.5 (Console/UI Integration) the navigation tokens
      used in ConsoleQuickStart manifests and their OCP version coupling. Missing this led to
      SSCSI-235-BUG-1 (Operators → Ecosystem rename causing stale navigation reference).
    input:
      spec_context: |
        Feature adds ConsoleQuickStart manifests that reference OpenShift Console
        navigation sections using qs-nav-* highlight tokens.
      repo_context: |
        Existing ConsoleQuickStart manifests may use qs-nav-operator-hub or
        qs-nav-ecosystem depending on OCP version.
    expected_output:
      section: "§10.5 Console/UI Integration"
      must_contain:
        - "qs-nav-ecosystem"
        - "version"   # must mention version coupling
      must_address:
        - "navigation tokens are version-coupled"
        - "verify token against target OCP release"
    rubric:
      pass: >
        §10.5 names the current navigation token, notes it changed across OCP versions,
        and instructs the implementor to verify against the target release branch
      fail: >
        §10.5 only says 'Console plugins, YAML samples, quickstarts' with no token details
    severity: medium
    source_issue: SSCSI-235-BUG-1
    rca: RCA-2

  - id: ra-003
    name: "CSO network policy label hook documented in §5 and §10.2"
    description: >
      When the operator's DaemonSet pods carry a platform network policy label hook
      (e.g., openshift.storage.network-policy.api-server: allow), the repo-assessment
      must document this in §5 (Reusable Assets) and §10.2 (Network Configuration)
      to prevent re-implementation of standalone policies.
    input:
      spec_context: |
        Feature may add network policies to the operator.
      repo_context: |
        assets/node.yaml DaemonSet carries label:
        openshift.storage.network-policy.api-server: allow
        This label hooks into CSO-managed egress policies.
    expected_output:
      section: "§5 Reusable Assets and §10.2 Proxy & Network Configuration"
      must_contain:
        - "openshift.storage.network-policy.api-server: allow"
        - "CSO"  # mention of CSO managing the policy
      must_address:
        - "do not create standalone egress network policies for api-server"
        - "use pod label to opt into CSO-managed policies"
    rubric:
      pass: >
        §5 or §10.2 documents the CSO NP label hook with exact key/value and instructs
        against standalone api-server egress policy creation
      fail: >
        §10.2 only covers proxy settings and trusted CA; no mention of CSO NP label;
        planner would design standalone network policies
    severity: medium
    source_issue: network-policy-redesign
    rca: RCA-4

  - id: ra-004
    name: "Install QuickStart circular dependency called out in §10.5 or §10.6"
    description: >
      The repo-assessment should note that install-type QuickStarts must NOT be placed in the
      OLM bundle due to circular dependency (resource appears after OLM install completes,
      but was meant to guide the install process).
    input:
      spec_context: |
        Feature adds both an install QuickStart and an example-usage QuickStart.
      repo_context: |
        OLM bundle in config/manifests/stable/. Installation is OLM-driven.
        demo/console/ exists for standalone apply.
    expected_output:
      section: "§10.5 or §10.6"
      must_address:
        - "install QuickStart must not be in OLM bundle"
        - "circular dependency"
        - "demo/ for install guides"
    rubric:
      pass: >
        §10.5 or §10.6 explicitly notes that install-type QuickStarts should NOT be in the
        OLM bundle with rationale
      fail: >
        No mention of bundle placement for QuickStart types; planner puts both in bundle
    severity: medium
    source_issue: SSCSI-235-GAP-1
    rca: RCA-1

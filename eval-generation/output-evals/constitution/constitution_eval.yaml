meta:
  stage: constitution
  template: constitution-template.md
  round: 1
  feature_bundle: SSCSI-235
  generated: "2026-07-02"

evals:
  - id: con-001
    name: "OLM bundle annotation principle present in constitution"
    description: >
      The constitution for this operator must include a principle or constraint that
      any resource placed into the OLM bundle (config/manifests/stable/) MUST carry the
      complete set of deployment-profile annotations. Missing this guardrail led to
      SSCSI-235-GAP-2 (annotations absent in PR #94, requiring a follow-up PR).
    input:
      repo_context: |
        Operator ships ConsoleQuickStart, ConsoleYAMLSample, and Service resources
        via the OLM bundle. Each resource type requires specific capability and
        deployment-profile annotations to appear on all supported installation profiles.
    expected_output:
      section: "Core Principles (Principle VI or Additional Constraints)"
      must_contain:
        - "OLM bundle"
        - "capability.openshift.io"
        - "include.release.openshift.io"
      must_address:
        - "any resource in config/manifests/stable/ must carry deployment-profile annotations"
        - "annotations are non-negotiable bundle contract"
    rubric:
      pass: >
        Constitution has a principle or constraint explicitly requiring deployment-profile
        annotations for all OLM bundle resources with evidence reference
      fail: >
        Constitution §VI only mentions CSV ownership and relatedImages; no annotation requirement
    severity: high
    source_issue: SSCSI-235-GAP-2
    rca: RCA-1

  - id: con-002
    name: "CSO network policy hook documented as a constraint"
    description: >
      The constitution should include a constraint that storage operator DaemonSet pods
      must use the CSO network policy label hook instead of standalone egress policies.
      This prevents re-implementation of platform-managed infrastructure.
    input:
      repo_context: |
        assets/node.yaml DaemonSet pods carry label
        openshift.storage.network-policy.api-server: allow.
        CSO manages egress-to-api-server policies for pods with this label.
    expected_output:
      section: "Core Principles or Additional Constraints"
      must_address:
        - "do not create standalone egress-to-api-server NetworkPolicy"
        - "use openshift.storage.network-policy.api-server: allow label"
    rubric:
      pass: >
        Constitution includes a constraint prohibiting standalone api-server egress policies
        and mandating the CSO label hook, with evidence from assets/node.yaml
      fail: >
        Constitution has generic RBAC/security section but no network policy hook constraint
    severity: medium
    source_issue: network-policy-redesign
    rca: RCA-4

  - id: con-003
    name: "AgentRoutingMode correctly set to PROVIDED when AGENTS.md exists"
    description: >
      The constitution AgentRoutingMode field must match the presence of AGENTS.md in the
      target repo. If AGENTS.md exists, AgentRoutingMode must be PROVIDED so downstream
      tasks use the correct agent IDs instead of provisional IDs.
    input:
      repo_context: |
        AGENTS.md exists at root of secrets-store-csi-driver-operator repository.
        It defines: OperatorController_Agent, Assets_Agent, OLMRelease_Agent,
        Testing_Agent, Docs_Agent.
    expected_output:
      header: "AgentRoutingMode: PROVIDED"
      section: "Agent Routing"
      must_contain:
        - "OperatorController_Agent"
        - "Assets_Agent"
        - "OLMRelease_Agent"
    rubric:
      pass: >
        Constitution header shows AgentRoutingMode: PROVIDED; Agent Routing section
        lists the 5 agent IDs from AGENTS.md with their scopes
      fail: >
        Constitution shows AgentRoutingMode: PROVISIONAL; uses generic provisional IDs
    severity: high
    source_issue: workflow-correctness
    rca: N/A

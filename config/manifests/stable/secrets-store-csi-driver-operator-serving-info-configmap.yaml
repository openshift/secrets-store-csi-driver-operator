# Bundle-level bootstrap for the operator's own --config file (SSCSI-264).
#
# Modeled directly on this directory's existing sibling
# secrets-store-csi-driver-operator-metrics-service.yaml: a plain, non-templated object
# shipped alongside the CSV so it is applied (into the operator's install namespace) by the
# same install-time mechanism, before the operator's own Deployment ever rolls out a pod. This
# is required because the CSV Deployment (see the Deployment spec in the sibling
# clusterserviceversion.yaml) mounts this ConfigMap as a volume for the operator's own
# `--config` flag -- without this bundle-level bootstrap object, a brand-new install would
# deadlock (the pod that would create it, via WithConditionalStaticResourcesController, can
# never start because its own volume mount has nothing to mount).
#
# After the operator's first successful reconcile, pkg/operator/starter.go's
# withServingInfoConfigMapAsset takes over as the sole, ongoing owner of this object's `data`
# (rendering the live-observed TLS policy from ClusterCSIDriver.spec.observedConfig on every
# resync) -- this bundle-level copy only ever matters for the brief window between "CSV
# installed" and "operator's first successful static-resources sync", and is never re-applied
# by the operator itself after that.
apiVersion: v1
kind: ConfigMap
metadata:
  name: secrets-store-csi-driver-operator-serving-info
data:
  config.yaml: ""

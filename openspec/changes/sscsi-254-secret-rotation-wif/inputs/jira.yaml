description: |
  Extend the OpenShift Secrets Store CSI Driver Operator to allow cluster administrators
  to configure:
  1. Secret rotation behavior (enable/disable, minimumRefreshAge interval) via ClusterCSIDriver
  2. Workload identity federation (WIF) tokenRequests audiences via ClusterCSIDriver

  These settings are dynamically propagated to:
  - storage.k8s.io/v1 CSIDriver object (requiresRepublish, tokenRequests)
  - Driver node DaemonSet container args (--enable-secret-rotation, --rotation-poll-interval)

  Key design decisions from EP review:
  - tokenRequests.type: Unmanaged (default) preserves existing manually-patched tokenRequests
    on the CSIDriver (e.g., Azure WIF audiences configured before this feature existed)
  - tokenRequests.type: Managed → operator is sole source of truth; immutable once set
  - requiresRepublish mirrors secretRotation.type (false when type: None)
  - minimumRefreshAge field replaces rotationPollIntervalSeconds (renamed in openshift/api PR #2906)
  - Upgrade safety: no behavior change for clusters without driverConfig set


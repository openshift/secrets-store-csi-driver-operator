notes: |
  The EP is merged (Jul 2, 2026). The openshift/api PR #2846 adding the API types is also
  merged. The rename PR #2906 (rotationPollIntervalSeconds → minimumRefreshAge) is still open.

  Implementation in secrets-store-csi-driver-operator requires:
  - Replace static csidriver.yaml with a dynamic AssetFunc
  - Add DaemonSetHookFunc for --enable-secret-rotation and --rotation-poll-interval
  - Wire ClusterCSIDriver informer into CSIDriverNodeServiceController
  - Unit tests for all nil-path permutations of driverConfig/secretsStore/secretRotation/tokenRequests
  - E2E tests for rotation on/off/custom, tokenRequests managed/unmanaged, upgrade scenarios
